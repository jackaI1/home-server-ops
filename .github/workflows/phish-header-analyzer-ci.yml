name: phish-header-analyzer / CI
on:
  push:
    branches:
    - main
    paths:
    - projects/phish-header-analyzer/**
    - .github/workflows/phish-header-analyzer-ci.yml
  pull_request:
    paths:
    - projects/phish-header-analyzer/**
    - .github/workflows/phish-header-analyzer-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.11'
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
        cache: pip
    - run: python -m pip install '.[dev]'
    - run: ruff check .
    - run: ruff format --check .
    - run: pytest -q
    - name: Exercise installed command on a synthetic investigation
      run: 'phish-header samples/phishing/credential-lure.eml --trusted-authserv-id mx.receiver.test --brand ''North Bank=bank.test''
        -o /tmp/investigation.md

        phish-header samples/benign/direct.eml --format json -o /tmp/direct.json

        '
defaults:
  run:
    working-directory: projects/phish-header-analyzer
