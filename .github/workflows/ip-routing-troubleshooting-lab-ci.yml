name: ip-routing-troubleshooting-lab / routing-lab
on:
  push:
    branches:
    - main
    paths:
    - projects/ip-routing-troubleshooting-lab/**
    - .github/workflows/ip-routing-troubleshooting-lab-ci.yml
  pull_request:
    paths:
    - projects/ip-routing-troubleshooting-lab/**
    - .github/workflows/ip-routing-troubleshooting-lab-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install -e '.[test]'
    - run: python -m pytest -q
    - run: bash -n scripts/*.sh cases/*/reproduce.sh
    timeout-minutes: 20
  lab-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-docker-action@v5
      with:
        version: v28.1.1
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - run: python -m pip install -e .
    - name: Check Compose and optionally load MPLS kernel modules
      run: 'docker compose version

        sudo modprobe mpls_router || true

        sudo modprobe mpls_iptunnel || true

        sudo modprobe dummy

        free -m

        '
    - name: Exercise actual routers, all five faults and all repairs
      run: ./scripts/lab.sh smoke
    - name: Verify a second deployment works without root or stale configuration
      run: './scripts/lab.sh up

        ./scripts/lab.sh check

        '
    - name: Always remove owned containers and networks
      if: always()
      run: ./scripts/lab.sh down
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: routing-evidence
        path: projects/ip-routing-troubleshooting-lab/artifacts/
        retention-days: 14
defaults:
  run:
    working-directory: projects/ip-routing-troubleshooting-lab
