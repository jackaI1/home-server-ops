name: "VM deployment: compose stack, TLS and health checks"
on:
  pull_request:
    paths:
      - 'deploy/**'
      - '.github/workflows/vm-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.github/workflows/vm-deploy.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: vm-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config:
    name: Test the config and validate the Compose file and provisioning script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test tools
        run: python -m pip install pytest==8.3.4 PyYAML==6.0.2
      - name: Run the deploy tests
        run: python -m pytest -q deploy/tests
      - name: Validate the Compose file
        env:
          DOMAIN: localhost
          ACME_EMAIL: ci@example.com
        run: docker compose -f deploy/compose/compose.yml config -q
      - name: Lint the provisioning script
        run: shellcheck deploy/vm/provision.sh
      - name: Dry-run the provisioning script
        run: deploy/vm/provision.sh --dry-run

  stack:
    name: Start the stack with TLS and check it with the health checker
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Provision into a temporary directory (no packages or firewall on the runner)
        run: |
          echo "INSTALL_DIR=$RUNNER_TEMP/home-ops" >> "$GITHUB_ENV"
          deploy/vm/provision.sh --skip-system --install-dir "$RUNNER_TEMP/home-ops"
      - name: Point the stack at localhost (Caddy issues a local certificate for it)
        run: |
          sed -i 's/^DOMAIN=.*/DOMAIN=localhost/; s/^ACME_EMAIL=.*/ACME_EMAIL=ci@example.com/' "$INSTALL_DIR/compose/.env"
          docker compose --project-directory "$INSTALL_DIR/compose" up -d --wait
          docker compose --project-directory "$INSTALL_DIR/compose" ps
      - name: Check the service and its certificate
        run: |
          docker compose --project-directory "$INSTALL_DIR/compose" cp \
            caddy:/data/caddy/pki/authorities/local/root.crt "$RUNNER_TEMP/caddy-root.crt"
          python3 "$INSTALL_DIR/health/check_health.py" \
            --url https://localhost/ --tls localhost:443 --cafile "$RUNNER_TEMP/caddy-root.crt" --warn-days 1
      - name: Check that a dead service makes the check fail
        run: |
          set +e
          python3 "$INSTALL_DIR/health/check_health.py" --url http://localhost:9/ --timeout 3
          code=$?
          set -e
          test "$code" -eq 1
      - name: Restart the stack and check it comes back with the same certificate
        run: |
          docker compose --project-directory "$INSTALL_DIR/compose" down
          docker compose --project-directory "$INSTALL_DIR/compose" up -d --wait
          python3 "$INSTALL_DIR/health/check_health.py" \
            --url https://localhost/ --tls localhost:443 --cafile "$RUNNER_TEMP/caddy-root.crt" --warn-days 1
      - name: Show logs on failure
        if: failure()
        run: docker compose --project-directory "$INSTALL_DIR/compose" logs --tail 80 || true
      - name: Stop the stack and remove its volumes
        if: always()
        run: docker compose --project-directory "$INSTALL_DIR/compose" down -v || true
