name: Jenkins controller, pipelines and the LifeOS image
on:
  pull_request:
    paths:
      - 'deploy/jenkins/**'
      - 'deploy/tests/test_jenkins.py'
      - '.github/workflows/jenkins.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/jenkins/**'
      - 'deploy/tests/test_jenkins.py'
      - '.github/workflows/jenkins.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: jenkins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint the compose file, both Jenkinsfiles and the deploy script; run the tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test tools
        run: python -m pip install pytest==8.3.4 PyYAML==6.0.2
      - name: Run the Jenkins and deploy tests
        run: python -m pytest -q deploy/tests/test_jenkins.py
      - name: Validate the Jenkins compose file
        run: DOCKER_GID=999 docker compose -f deploy/jenkins/compose.yml config -q
      - name: Validate the LifeOS compose file
        run: LIFEOS_IMAGE=lifeos:ci docker compose -f deploy/jenkins/lifeos-compose.yml config -q
      - name: Lint the deploy script
        run: shellcheck deploy/jenkins/deploy-lifeos.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Lint both Jenkinsfiles with Groovy lint
        run: npx --yes npm-groovy-lint@14.1.1 --files "deploy/jenkins/Jenkinsfile*" --failon error

  controller:
    name: Start the pinned Jenkins controller and check the login page on loopback
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the controller
        run: |
          gid="$(stat -c '%g' /var/run/docker.sock)"
          echo "DOCKER_GID=$gid" > deploy/jenkins/.env
          docker compose -f deploy/jenkins/compose.yml up -d --build --wait
      - name: Check the login page answers on 127.0.0.1 only
        run: |
          curl -fsS -o /dev/null -w 'login page: %{http_code}\n' http://127.0.0.1:8080/login
          listen="$(ss -ltn 'sport = :8080' | tail -n +2)"
          echo "$listen"
          echo "$listen" | grep -q '127.0.0.1:8080'
          if echo "$listen" | grep -qE '0\.0\.0\.0:8080|\[::\]:8080'; then
            echo "port 8080 is reachable from other hosts" >&2
            exit 1
          fi
      - name: Check the plugins were baked into the image
        run: |
          count="$(docker compose -f deploy/jenkins/compose.yml exec -T jenkins sh -c 'ls /usr/share/jenkins/ref/plugins | wc -l' | tr -d '[:space:]')"
          echo "plugins installed: $count"
          test "$count" -ge 10
          docker compose -f deploy/jenkins/compose.yml exec -T jenkins sh -c 'test -x /usr/local/bin/docker && docker --version'
      - name: Show logs on failure
        if: failure()
        run: docker compose -f deploy/jenkins/compose.yml logs --tail 80 jenkins
      - name: Stop the controller and remove its volume
        if: always()
        run: docker compose -f deploy/jenkins/compose.yml down -v

  lifeos-image:
    name: Run the LifeOS steps from the Jenkinsfile and build the multi-stage image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Check out LifeOS (public repository)
        uses: actions/checkout@v4
        with:
          repository: jackaI1/lifeos-open
          path: lifeos
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: lifeos/package-lock.json
      - name: Run the same steps as the build pipeline
        working-directory: lifeos
        run: |
          npm ci
          npm run lint
          npm run typecheck
          mkdir -p reports
          node --test --test-reporter=spec --test-reporter=junit --test-reporter-destination=stdout --test-reporter-destination=reports/junit.xml test/*.test.mjs
      - name: Build the multi-stage image
        run: |
          rm -rf lifeos/node_modules
          docker build -f deploy/jenkins/lifeos.Dockerfile -t lifeos:ci lifeos
      - name: Start the image and check it answers on loopback
        run: |
          docker run -d --name lifeos-ci --network host --cap-drop ALL \
            --security-opt no-new-privileges:true lifeos:ci
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8787/; then echo "LifeOS answered"; break; fi
            sleep 2
          done
          curl -fsS -o /dev/null -w 'LifeOS root: %{http_code}\n' http://127.0.0.1:8787/
      - name: Show the container log on failure
        if: failure()
        run: docker logs lifeos-ci | tail -80
      - name: Stop the container
        if: always()
        run: docker rm -f lifeos-ci || true
