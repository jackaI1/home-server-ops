name: vuln-remediation-tracker / CI
on:
  push:
    branches:
    - main
    paths:
    - projects/vuln-remediation-tracker/**
    - .github/workflows/vuln-remediation-tracker-ci.yml
  pull_request:
    paths:
    - projects/vuln-remediation-tracker/**
    - .github/workflows/vuln-remediation-tracker-ci.yml
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python:
        - '3.10'
        - '3.12'
        - '3.13'
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v6
      with:
        version: 0.12.19
        enable-cache: true
        working-directory: projects/vuln-remediation-tracker
    - run: sudo apt-get update -qq && sudo apt-get install -y nmap
    - run: uv sync --frozen --extra test --python '${{ matrix.python }}'
    - run: uv run --frozen ruff check src tests scripts
    - run: uv run --frozen ruff format --check src tests scripts
    - run: uv run --frozen pytest -q
      env:
        REQUIRE_NMAP: '1'
    - run: uv build
    - name: Check installed wheel outside the checkout
      run: 'uv venv /tmp/wheel-check --python ''${{ matrix.python }}''

        uv pip install --python /tmp/wheel-check/bin/python dist/*.whl

        cd /tmp

        /tmp/wheel-check/bin/vuln-tracker --db /tmp/wheel.sqlite report --format json

        '
    timeout-minutes: 20
defaults:
  run:
    working-directory: projects/vuln-remediation-tracker
