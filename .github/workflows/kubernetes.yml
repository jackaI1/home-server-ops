name: Kubernetes chart and deployment
on:
  pull_request:
    paths:
      - 'k8s/**'
      - 'telemetry/**'
      - 'requirements.txt'
      - '.github/workflows/kubernetes.yml'
  push:
    branches: [main]
    paths:
      - 'k8s/**'
      - 'telemetry/**'
      - 'requirements.txt'
      - '.github/workflows/kubernetes.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: kubernetes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chart:
    name: Lint, test and validate the chart
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test tools
        run: |
          python -m pip install pytest==8.3.4 PyYAML==6.0.2
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | sudo tar -xz -C /usr/local/bin kubeconform
      - name: Lint chart
        run: helm lint k8s/charts/home-ops --set postgres.existingSecret=postgres-credentials --strict
      - name: Run chart and network policy tests
        run: python -m pytest -q k8s/tests
      - name: Validate rendered manifests against the Kubernetes 1.31 schema
        run: |
          helm template home-ops k8s/charts/home-ops --namespace home-ops \
            --set postgres.existingSecret=postgres-credentials > rendered.yaml
          kubeconform -strict -summary -kubernetes-version 1.31.0 rendered.yaml
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Check Terraform formatting and syntax
        run: |
          terraform -chdir=k8s/terraform fmt -check -recursive
          terraform -chdir=k8s/terraform init -backend=false
          terraform -chdir=k8s/terraform validate

  kind:
    name: Deploy to kind and check behaviour
    needs: chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Throwaway password for the disposable CI cluster only. Never reused elsewhere.
      TF_VAR_postgres_password: ci0placeholder0000000000000000
      TF_VAR_kube_context: kind-ci
      TF_VAR_ingress_pod_labels: '{"access":"telemetry-client"}'
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: ci
          config: k8s/kind-config.yaml
          wait: 0s
      - name: Install Calico so NetworkPolicy is enforced
        run: |
          kubectl apply -f https://raw.githubusercontent.com/projectcalico/calico/v3.28.2/manifests/calico.yaml
          kubectl -n kube-system rollout status daemonset/calico-node --timeout=300s
          kubectl wait --for=condition=Ready nodes --all --timeout=300s
      - name: Build the telemetry image and load it into kind
        run: |
          docker build -f telemetry/Dockerfile -t telemetry:local .
          kind load docker-image telemetry:local --name ci
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Deploy with Terraform
        run: |
          terraform -chdir=k8s/terraform init
          terraform -chdir=k8s/terraform apply -auto-approve
      - name: Run end-to-end checks
        run: ./k8s/scripts/e2e-kind.sh
      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl -n home-ops get pods,jobs,cronjobs,networkpolicies -o wide || true
          kubectl -n home-ops get events --sort-by=.lastTimestamp | tail -30 || true
          kubectl -n home-ops logs statefulset/postgres --tail=50 || true
          kubectl -n home-ops logs deployment/telemetry --tail=50 || true
