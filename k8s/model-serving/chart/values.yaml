# Defaults for the model server. Override the image tag to roll out a new version.
image:
  repository: model-server
  tag: "0.1.0"
  pullPolicy: IfNotPresent

# Shown in replies so you can see which model answered.
modelName: stub-model
# How long the model takes to load. Readiness stays false until then.
modelLoadSeconds: 2

# Used only when autoscaling is off.
replicaCount: 1

service:
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

probes:
  readiness:
    path: /ready
    initialDelaySeconds: 1
    periodSeconds: 5
    failureThreshold: 3
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3

# Scale on CPU. Needs metrics-server in the cluster (kind needs it installed separately).
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# Replace one pod at a time. A new pod must pass readiness before an old one stops.
rollout:
  maxSurge: 1
  maxUnavailable: 0
  revisionHistoryLimit: 5
