{{- if .Values.backup.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backups
  labels:
    {{- include "home-ops.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.backup.storage.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.storage.size }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
  labels:
    {{- include "home-ops.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pg-dump
              image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
              imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
              env:
                - name: PGHOST
                  value: {{ include "home-ops.postgresHost" . | quote }}
                - name: PGUSER
                  value: {{ .Values.postgres.user | quote }}
                - name: PGDATABASE
                  value: {{ .Values.postgres.database | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.postgres.existingSecret }}
                      key: POSTGRES_PASSWORD
                - name: RETENTION_DAYS
                  value: {{ .Values.backup.retentionDays | quote }}
              command: [sh, -c]
              args:
                - |
                  set -eu
                  file="/backups/${PGDATABASE}-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
                  pg_dump --no-owner | gzip -9 > "${file}.partial"
                  gzip -t "${file}.partial"
                  mv "${file}.partial" "${file}"
                  echo "wrote ${file}"
                  # Textfile for node_exporter: the time of the last verified backup.
                  mkdir -p /backups/textfile
                  printf 'home_ops_backup_last_success_timestamp_seconds{database="%s"} %s\n' \
                    "${PGDATABASE}" "$(date +%s)" > /backups/textfile/home-ops-backup.prom.tmp
                  mv /backups/textfile/home-ops-backup.prom.tmp /backups/textfile/home-ops-backup.prom
                  find /backups -name "${PGDATABASE}-*.sql.gz" -mtime "+${RETENTION_DAYS}" -print -delete
              resources:
                {{- toYaml .Values.backup.resources | nindent 16 }}
              securityContext:
                {{- include "home-ops.securityContext" . | nindent 16 }}
              volumeMounts:
                - name: backups
                  mountPath: /backups
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: backups
{{- end }}
