# Default deny: every pod in the namespace refuses all traffic unless a policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    {{- include "home-ops.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Every pod may ask cluster DNS for names. Nothing else is open by default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  labels:
    {{- include "home-ops.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# The API accepts traffic only from the namespaces and pod labels listed in values.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: telemetry-ingress
  labels:
    {{- include "home-ops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: telemetry
  policyTypes: [Ingress]
  ingress:
    {{- if not (or .Values.telemetry.ingress.fromNamespaces .Values.telemetry.ingress.fromPodLabels) }}
    {{- fail "telemetry.ingress needs at least one namespace or pod label; an empty list would allow all traffic" }}
    {{- end }}
    - from:
        {{- range .Values.telemetry.ingress.fromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
        {{- if .Values.telemetry.ingress.fromPodLabels }}
        - podSelector:
            matchLabels:
              {{- toYaml .Values.telemetry.ingress.fromPodLabels | nindent 14 }}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ .Values.telemetry.port }}}
---
# The telemetry API may talk to PostgreSQL. It may not talk to anything else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: telemetry-egress
  labels:
    {{- include "home-ops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: telemetry
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - {protocol: TCP, port: 5432}
---
# PostgreSQL accepts connections only from the API and from backup and restore jobs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
  labels:
    {{- include "home-ops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: telemetry
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backup
      ports:
        - {protocol: TCP, port: 5432}
---
# Backup and restore jobs may reach PostgreSQL. Nothing else leaves their pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backup-egress
  labels:
    {{- include "home-ops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: backup
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres
      ports:
        - {protocol: TCP, port: 5432}
{{- with .Values.telemetry.ingress.fromPodLabels }}
---
# Client pods that were let in above also need permission to call the API themselves,
# because default-deny blocks their outgoing traffic too.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: telemetry-clients-egress
  labels:
    {{- include "home-ops.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- toYaml . | nindent 6 }}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: telemetry
      ports:
        - {protocol: TCP, port: {{ $.Values.telemetry.port }}}
{{- end }}
