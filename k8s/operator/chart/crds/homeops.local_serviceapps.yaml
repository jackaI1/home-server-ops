---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: serviceapps.homeops.local
spec:
  group: homeops.local
  names:
    kind: ServiceApp
    listKind: ServiceAppList
    plural: serviceapps
    singular: serviceapp
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Version
          type: string
          jsonPath: .spec.version
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Health
          type: string
          jsonPath: .status.conditions[?(@.type=="HealthCheck")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          description: ServiceApp describes one home server service and how to check it.
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - image
                - version
              properties:
                image:
                  description: Container image without a tag, for example nginx.
                  type: string
                  minLength: 1
                version:
                  description: Image tag to run, for example 1.27-alpine.
                  type: string
                  minLength: 1
                port:
                  description: Port the container listens on.
                  type: integer
                  default: 80
                  minimum: 1
                  maximum: 65535
                healthPath:
                  description: HTTP path the operator checks, for example /healthz.
                  type: string
                  default: /
                replicas:
                  description: Number of pods to keep running.
                  type: integer
                  default: 1
                  minimum: 0
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                deployedVersion:
                  type: string
                readyReplicas:
                  type: integer
                  format: int32
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                        maxLength: 32768
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      reason:
                        type: string
                        maxLength: 1024
                        minLength: 1
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      type:
                        type: string
                        maxLength: 316
