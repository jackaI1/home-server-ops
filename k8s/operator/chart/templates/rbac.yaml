apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-serviceapp-operator
  labels:
    {{- include "serviceapp-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["homeops.local"]
    resources: ["serviceapps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["homeops.local"]
    resources: ["serviceapps/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-serviceapp-operator
  labels:
    {{- include "serviceapp-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-serviceapp-operator
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-serviceapp-operator
    namespace: {{ .Release.Namespace }}
