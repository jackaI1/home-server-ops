---
- name: Refresh the package index
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

- name: Turn on automatic security updates
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
  when: base_unattended_upgrades | bool

- name: Write the TCP tuning file
  ansible.builtin.template:
    src: 90-home-server-sysctl.conf.j2
    dest: /etc/sysctl.d/90-home-server.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl

