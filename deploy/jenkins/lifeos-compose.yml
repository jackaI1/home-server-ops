# LifeOS as it runs on the home server. Jenkins' deploy job copies this file and the secret env file
# into the deploy folder, then starts it with LIFEOS_IMAGE set to the image the build job made.
name: lifeos

services:
  lifeos:
    image: ${LIFEOS_IMAGE:?set LIFEOS_IMAGE to the image to run}
    restart: unless-stopped
    # LifeOS binds to 127.0.0.1 itself, so the host network keeps it reachable only from the server.
    network_mode: host
    env_file: lifeos.env
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
