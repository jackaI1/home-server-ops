# Services for the home server VM. Caddy is the only service that faces the network:
# it terminates HTTPS, gets certificates from Let's Encrypt (or a local CA for localhost),
# renews them on its own, and forwards requests to the app over the private Docker network.
name: home-ops

services:
  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      # Caddy's admin API answers on localhost:2019 when Caddy is running and the config loaded.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  app:
    # A tiny sample service that echoes the request back. Replace it with your own app image.
    image: traefik/whoami:v1.10.3
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    expose: ["80"]

volumes:
  caddy_data:
  caddy_config:
