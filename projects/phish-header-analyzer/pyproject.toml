[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "phish-header-analyzer"
version = "0.1.0"
description = "Offline email-header investigations with traceable evidence and uncertainty"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Jack Lai"}]
dependencies = ["authres==1.2.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
phish-header = "phish_header_analyzer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
