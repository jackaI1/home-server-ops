apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit
  namespace: device-automation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: audit
  template:
    metadata:
      labels:
        app: audit
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: audit
          image: device-automation:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
          env:
            - name: ROLE
              value: audit
            - name: AUDIT_DB
              value: "/data/audit.db"
            - name: INTAKE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: intake-auth
                  key: token
            - name: WORKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: worker-auth
                  key: token
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: audit-data
---
apiVersion: v1
kind: Service
metadata:
  name: audit
  namespace: device-automation
spec:
  selector:
    app: audit
  ports:
    - name: http
      port: 8080
      targetPort: http
