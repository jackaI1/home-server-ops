# Every pod starts with no inbound or outbound application connections.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: device-automation
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns
  namespace: device-automation
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intake-ingress
  namespace: device-automation
spec:
  podSelector:
    matchLabels: {app: intake}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: client}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: client-egress
  namespace: device-automation
spec:
  podSelector:
    matchLabels: {app: client}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: intake}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: intake-egress
  namespace: device-automation
spec:
  podSelector:
    matchLabels: {app: intake}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: audit}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-egress
  namespace: device-automation
spec:
  podSelector:
    matchLabels: {app: worker}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app: audit}
        - podSelector:
            matchLabels: {app: device}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-ingress
  namespace: device-automation
spec:
  podSelector:
    matchLabels: {app: audit}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: intake}
        - podSelector:
            matchLabels: {app: worker}
      ports: [{protocol: TCP, port: 8080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: device-ingress
  namespace: device-automation
spec:
  podSelector:
    matchLabels: {app: device}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: worker}
      ports: [{protocol: TCP, port: 8080}]
