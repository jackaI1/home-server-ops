apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-config
data:
  APP_ENV: local
---
apiVersion: v1
kind: Secret
metadata:
  name: telemetry-db
data:
  DATABASE_URL: cG9zdGdyZXNxbCtwc3ljb3BnOi8vdGVsZW1ldHJ5OmxvY2FsLW9ubHlAcG9zdGdyZXM6NTQzMi90ZWxlbWV0cnk=
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry
spec:
  replicas: 1
  selector:
    matchLabels: {app: telemetry}
  template:
    metadata:
      labels: {app: telemetry}
    spec:
      containers:
        - name: telemetry
          image: telemetry:local
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          envFrom:
            - configMapRef: {name: telemetry-config}
            - secretRef: {name: telemetry-db}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
          livenessProbe:
            httpGet: {path: /health, port: 8000}
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry
spec:
  selector: {app: telemetry}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - {name: POSTGRES_USER, value: telemetry}
            - {name: POSTGRES_PASSWORD, value: local-only}
            - {name: POSTGRES_DB, value: telemetry}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: [pg_isready, -U, telemetry]}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports: [{port: 5432}]
