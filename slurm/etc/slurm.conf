# slurm.conf for the home GPU queue: two workstations, each with two GPUs.
# Copy to /etc/slurm/slurm.conf on the controller and on both workstations.
ClusterName=home-gpu
SlurmctldHost=ws-a

# GPUs are scheduled as generic resources (GRES) and counted in the accounting database.
GresTypes=gpu
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory

# Backfill lets a short job run in a gap without delaying the job that is waiting for the gap.
SchedulerType=sched/backfill
SchedulerParameters=bf_window=1440,bf_max_job_test=500

# Priority: partition tier first, then fair-share (recent use lowers priority), then age.
PriorityType=priority/multifactor
PriorityDecayHalfLife=7-00:00:00
PriorityWeightFairShare=10000
PriorityWeightAge=1000
PriorityWeightPartition=1000
PriorityMaxAge=7-00:00:00

# Preemption: a job in a higher-tier partition may requeue a job in a lower tier.
PreemptType=preempt/partition_prio
PreemptMode=REQUEUE

# Accounting: who used how many GPUs, and the per-user limits in slurmdbd are enforced.
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageTRES=gres/gpu
AccountingStorageEnforce=associations,limits,qos
JobAcctGatherType=jobacct_gather/linux

# Nodes: each workstation exposes two GPUs and its CPUs and memory.
NodeName=ws-a Gres=gpu:2 CPUs=16 RealMemory=64000 State=UNKNOWN
NodeName=ws-b Gres=gpu:2 CPUs=16 RealMemory=64000 State=UNKNOWN

# review: short interactive drawing-review runs, high tier, may requeue benchmarks.
PartitionName=review Nodes=ws-a,ws-b MaxTime=02:00:00 PriorityTier=2 State=UP Default=YES
# bench: long model benchmarks, low tier, requeued when a review job needs the GPUs.
PartitionName=bench Nodes=ws-a,ws-b MaxTime=12:00:00 PriorityTier=1 State=UP
