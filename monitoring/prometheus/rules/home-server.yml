# Alert rules for the home server. Each alert has a runbook in monitoring/runbooks/.
# Durations (for:) are there so that a short blip does not page anyone.
# promtool tests for every rule are in prometheus/tests/alerts_test.yml.
groups:
  - name: availability
    rules:
      - alert: LifeOSDemoDown
        expr: probe_success{job="lifeos-demo"} == 0
        for: 10m
        labels:
          severity: critical
          service: lifeos
        annotations:
          summary: "LifeOS demo is not answering at {{ $labels.instance }}"
          runbook_url: "https://github.com/jackaI1/home-server-ops/blob/main/monitoring/runbooks/LifeOSDemoDown.md"

      - alert: LifeOSHealthDown
        expr: probe_success{job="lifeos-health"} == 0
        for: 10m
        labels:
          severity: critical
          service: lifeos
        annotations:
          summary: "LifeOS health check is failing at {{ $labels.instance }}"
          runbook_url: "https://github.com/jackaI1/home-server-ops/blob/main/monitoring/runbooks/LifeOSHealthDown.md"

      - alert: ServiceDown
        expr: up{job=~"node|alertmanager|blackbox|prometheus"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} exporter is down on {{ $labels.instance }}"
          runbook_url: "https://github.com/jackaI1/home-server-ops/blob/main/monitoring/runbooks/ServiceDown.md"

      - alert: TLSCertificateExpiresSoon
        expr: (probe_ssl_earliest_cert_expiry{job=~"lifeos.*"} - time()) < 14 * 86400
        for: 1h
        labels:
          severity: warning
          service: lifeos
        annotations:
          summary: "Certificate for {{ $labels.instance }} expires in under 14 days"
          runbook_url: "https://github.com/jackaI1/home-server-ops/blob/main/monitoring/runbooks/TLSCertificateExpiresSoon.md"

      - alert: TLSCertificateExpiresVerySoon
        expr: (probe_ssl_earliest_cert_expiry{job=~"lifeos.*"} - time()) < 3 * 86400
        for: 1h
        labels:
          severity: critical
          service: lifeos
        annotations:
          summary: "Certificate for {{ $labels.instance }} expires in under 3 days"
          runbook_url: "https://github.com/jackaI1/home-server-ops/blob/main/monitoring/runbooks/TLSCertificateExpiresVerySoon.md"

  - name: capacity
    rules:
      # Fires only when the trend says the disk fills within 24 hours AND it is already
      # under 25% free. The trend alone fires on a log that grows at night and shrinks by morning.
      - alert: DiskWillFillWithin24h
        expr: |
          (
            predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|vfat"}[6h], 24 * 3600) < 0
          )
          and
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|vfat"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|vfat"} < 0.25
          )
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} is on track to fill within 24 hours"
          runbook_url: "https://github.com/jackaI1/home-server-ops/blob/main/monitoring/runbooks/DiskWillFillWithin24h.md"

      - alert: DiskAlmostFull
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|vfat"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|vfat"} < 0.10
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} on {{ $labels.instance }} has less than 10% free"
          runbook_url: "https://github.com/jackaI1/home-server-ops/blob/main/monitoring/runbooks/DiskAlmostFull.md"

  - name: backups
    rules:
      # The backup job writes this timestamp after gzip -t passes. The nightly run is at 02:17,
      # so 26 hours leaves one hour of slack for a late run.
      - alert: BackupStale
        expr: time() - home_ops_backup_last_success_timestamp_seconds > 26 * 3600
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Last good backup of {{ $labels.database }} is more than 26 hours old"
          runbook_url: "https://github.com/jackaI1/home-server-ops/blob/main/monitoring/runbooks/BackupStale.md"

      - alert: BackupTimestampMissing
        expr: absent(home_ops_backup_last_success_timestamp_seconds)
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "No backup timestamp has been reported for an hour"
          runbook_url: "https://github.com/jackaI1/home-server-ops/blob/main/monitoring/runbooks/BackupTimestampMissing.md"
