# Prometheus scrape configuration. Paths are relative to the container mount at /etc/prometheus.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Host metrics: CPU, memory, disks, plus the backup timestamp from the textfile folder.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  - job_name: blackbox
    static_configs:
      - targets: ["blackbox-exporter:9115"]

  # Probes: blackbox_exporter makes the request, so the target address is passed as ?target=.
  - job_name: lifeos-demo
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["https://lifeos.jacklai.ca/"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: lifeos-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["https://lifeos.jacklai.ca/healthz"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
